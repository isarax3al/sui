name: Reference Safety Escalation Probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    if: github.event.issue.pull_request && github.event.comment.body == '/run-reference-safety-probe'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/regex-reference-safety-diff-fuzz

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-15

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: external-crates/move
          cache-on-failure: true
          shared-key: regex-reference-safety-probe-v1

      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y clang pkg-config libssl-dev cmake

      - name: Build and run deterministic probe
        id: probe
        shell: bash
        run: |
          set +e
          cargo +nightly-2025-12-15 run \
            --manifest-path external-crates/move/crates/bytecode-verifier-libfuzzer/Cargo.toml \
            --bin reference_safety_probe \
            2>&1 | tee /tmp/reference-safety-probe.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post probe result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          EXIT_CODE: ${{ steps.probe.outputs.exit_code }}
        shell: bash
        run: |
          {
            echo "## Reference-safety escalation probe"
            echo
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo "- Exit code: \`${EXIT_CODE:-not-started}\`"
            echo
            echo '```text'
            if grep -E '^(CASE=|error\[|error:|warning:)' /tmp/reference-safety-probe.log > /tmp/probe-summary.txt; then
              cat /tmp/probe-summary.txt
            else
              tail -n 100 /tmp/reference-safety-probe.log
            fi
            echo '```'
          } > /tmp/probe-comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file /tmp/probe-comment.md
