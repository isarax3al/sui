name: Reference Safety Differential Status

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  status:
    if: github.event.issue.pull_request && github.event.comment.body == '/status-reference-safety-diff-fuzz'
    runs-on: ubuntu-latest
    steps:
      - name: Compact old results and post run status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("## Reference-safety differential fuzz result"))) | .id' \
            | while read -r id; do
                [ -n "$id" ] && gh api -X DELETE "repos/$REPOSITORY/issues/comments/$id" || true
              done

          gh run list --repo "$REPOSITORY" --workflow "Reference Safety Differential Runner" --limit 8 \
            --json databaseId,event,status,conclusion,createdAt,updatedAt,headSha \
            --template '{{range .}}{{printf "run=%v event=%s status=%s conclusion=%s created=%s updated=%s head=%s\n" .databaseId .event .status .conclusion .createdAt .updatedAt .headSha}}{{end}}' \
            > /tmp/run-status.txt

          {
            echo "## Differential fuzz run status"
            echo
            echo '```text'
            cat /tmp/run-status.txt
            echo '```'
          } > /tmp/status-comment.md

          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file /tmp/status-comment.md
